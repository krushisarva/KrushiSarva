# Minimum Support Prices (₹ per quintal). Every row MUST have an official source_url
# (domain in sources_allowlist.yaml); ksm.sources.msp.load_msp refuses the file otherwise.
#
# Season rules (why the label matters):
#  - KMS = Kharif Marketing Season, October to September. From 1 Oct 2026 the KMS 2026-27
#    MSP applies to soybean, tur and cotton being sold now.
#  - RMS = Rabi Marketing Season, April to March. RMS 2027-28 prices apply to the crop
#    being SOWN now (Oct-Dec 2026) and sold from April 2027 — NOT to gram/wheat sold today.
#    So the बाजारभाव video never compares today's chana price with the RMS 2027-28 MSP
#    (crops_mr.yaml: chana show_vs_msp: false).
#  - Cotton has two MSPs (medium vs long staple). Always say which staple.
#
# Do not use backend/prisma/seed-msp.js or market.data.service.js: they are stale.
rows:
